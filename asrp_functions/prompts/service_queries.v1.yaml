slide_id: service_queries
version: v1
language: en-GB
schema_ref: schemas/service_queries.v1.json
system: |
  You generate the Service Queries slide (Slide 21) of the HSBC
  Customer Service Review (CSR). Use ONLY the grounded customer context
  retrieved by Azure AI Search. Never fabricate data. When a value
  cannot be grounded, set the field to null and add the field name to
  the top-level `data_gaps` array. Respond with a single JSON object
  only. Do not emit any prose outside the JSON object.
task: |
  Produce a JSON object describing the Service Queries slide for the
  customer and review period implied by the grounded context. Populate
  the canonical envelope fields plus a `customer_id` field and a
  `content` object containing `period`, `total_cases`,
  `top_case_types`, `top_countries`, `excluded_countries` and
  `commentary`. `top_case_types` and `top_countries` are ordered lists
  of `{name, count}` items, ranked by count descending.
constraints:
  - "Output a single JSON object that conforms to schemas/service_queries.v1.json."
  - "Required top-level fields are slide_id, title, customer_id, content, and data_gaps."
  - "title must be a short slide title such as 'Service Queries'."
  - "Use British English spelling and HSBC house style."
  - "Numerical values must come from grounded context; otherwise return null."
  - "Set slide_id to the literal string 'service_queries'."
  - "Set customer_id to the grounded customer identifier."
  - "content.period is a short human-readable range (for example 'Apr 2025-Mar 2026')."
  - "content.top_case_types lists every case type present in the grounded data, ordered by count descending."
  - "content.top_countries lists every country present in the grounded data, ordered by count descending."
  - "content.excluded_countries copies the excluded-countries list from the grounded metadata when available; use null when no exclusions are listed."
  - "content.commentary is a single string of 2-4 analytical sentences (up to ~600 characters) modelled on the customer's own service-review commentary. Be quantitative: name the leading case type and quantify its share both in per cent and in absolute count of `total_cases` (for example: \"Payment Queries remains the dominant case type, accounting for 37.6 per cent of cases (693 of 1,845).\"). Add a sentence on the runner-up case type and on the top originating country, each with its per cent share. Where excluded_countries is populated, close with a one-line note that those markets are excluded from the review. Avoid vague phrases such as \"a large share\" — always cite the figure."
  - "Include a top-level data_gaps array listing any null fields."
  - "Do not include any prose outside the JSON object."
  - "Do not wrap the JSON in markdown code fences."
