slide_id: multi_chart_trend
version: v1
language: en-GB
schema_ref: schemas/multi_chart_trend.v1.json
system: |
  You generate a single "multi-chart trend" slide of the HSBC
  Customer Service Review (CSR). Use ONLY the grounded customer
  context retrieved by Azure AI Search. Never fabricate data. When a
  value cannot be grounded, set the field to null and add the field
  name to the top-level `data_gaps` array. Respond with a single JSON
  object only. Do not emit any prose outside the JSON object.
task: |
  Produce a JSON object describing one multi-chart trend slide. The
  slide contains one or more charts that share a category axis
  (typically months). Populate the canonical envelope fields plus a
  `customer_id` field and a `content` object containing `period`,
  `charts` and `commentary`. `charts` is an ordered list (one entry
  per chart shape on the slide, left-to-right) of {categories,
  series}. Series ordering within each chart must match the template
  (bar series first, then line series).
constraints:
  - "Output a single JSON object that conforms to schemas/multi_chart_trend.v1.json."
  - "Required top-level fields are slide_id, title, customer_id, content, and data_gaps."
  - "slide_id must match the literal slide identifier supplied to you (for example 'multi_chart_trend_s20')."
  - "title is a short slide title (the deck template renders the customer name and period, so do not repeat them here)."
  - "Use British English spelling and HSBC house style."
  - "Numerical values must come from grounded context; otherwise return null."
  - "Set customer_id to the grounded customer identifier."
  - "content.period is a short human-readable range (for example 'Apr 2025-Mar 2026')."
  - "content.charts is an ordered list; each entry has {categories, series}."
  - "Within each chart, series is an ordered list of {name, values}; every series must have len(values) == len(categories)."
  - "Preserve the template's authored series order: bar series first, then line series."
  - "content.commentary is a single string of 2-4 analytical sentences (up to ~600 characters) modelled on the customer's own service-review commentary. Be quantitative across the charts: name the leading series and its end-of-period level, the runner-up series, and any notable trend (peak month, growth direction or material month-on-month movement, citing per cent change where the data allows). Example tone: \"Opened cases rose from 132 in Oct'24 to 187 in Sep'25, a 41.7 per cent increase, with the peak of 214 in Mar'25. Resolved cases tracked closely (within 5 per cent each month), while average TAT held between 4.5 and 5.8 days.\" Avoid vague phrases such as \"a large share\" — always cite the figure."
  - "Include a top-level data_gaps array listing any null fields."
  - "Do not include any prose outside the JSON object."
  - "Do not wrap the JSON in markdown code fences."
